# HAProxy passive node config file
global
    log stdout format short daemon        # Send logs to systemd
    maxconn 2000
    user haproxy
    group haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 15m  # Modify for a longer timeout when client is inactive, seems to only affect the Web-based SSL-VPN
    timeout server 5m

frontend vpn_frontend
    bind xxx.xxx.xxx.xxx:443  # Keepalived virtual IP goes here  
    mode tcp
    default_backend vpn_backend
    option tcplog

backend vpn_backend
    mode tcp
    balance source
    stick-table type ip size 200k expire 30m 
    stick on src
    server FG1 yyy.yyy.yyy.yyy:443 check inter 5s fall 3 rise 2 # Enter the IP of the Fortigate-1 VPN interface here
    server FG2 zzz.zzz.zzz.zzz:443 check inter 5s fall 3 rise 2 # Enter the IP of the Fortigate-2 VPN interface here

listen stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /haproxy_stats
    stats refresh 10s
    stats auth admin:XXXXX
    stats hide-version 
